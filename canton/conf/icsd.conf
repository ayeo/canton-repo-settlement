# The depository's node: hosts ICSD, signatory of every instrument, position
# and hold. No cash contract names it, so none reaches this database.
canton.participants.icsd {
  storage {
    type = postgres
    config {
      dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
      properties {
        serverName = "postgres"
        portNumber = 5432
        databaseName = "canton_icsd"
        user = "canton"
        # Local PoC only; in production inject a secret.
        password = "canton"
      }
    }
    parameters.max-connections = 8
  }

  ledger-api      { address = "0.0.0.0", port = 5011 }
  http-ledger-api { address = "0.0.0.0", port = 7011 }
  admin-api       { address = "0.0.0.0", port = 5012 }
}
