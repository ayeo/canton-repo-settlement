# Console configuration: connects to the running containers, so addresses are
# as seen from the host.
canton {
  remote-sequencers.sequencer1 {
    # A Docker network address: the console only uses admin-api; this one is
    # handed to the mediator and participants, which call it from their containers.
    public-api { address = "sequencer", port = 5001 }
    admin-api  { address = "localhost", port = 5002 }
  }

  remote-mediators.mediator1 {
    admin-api { address = "localhost", port = 5003 }
  }

  remote-participants.icsd {
    ledger-api { address = "localhost", port = 5011 }
    admin-api  { address = "localhost", port = 5012 }
  }

  remote-participants.centralbank {
    ledger-api { address = "localhost", port = 5021 }
    admin-api  { address = "localhost", port = 5022 }
  }

  remote-participants.alpha {
    ledger-api { address = "localhost", port = 5031 }
    admin-api  { address = "localhost", port = 5032 }
  }

  remote-participants.bravo {
    ledger-api { address = "localhost", port = 5041 }
    admin-api  { address = "localhost", port = 5042 }
  }

  remote-participants.charlie {
    ledger-api { address = "localhost", port = 5051 }
    admin-api  { address = "localhost", port = 5052 }
  }
}
