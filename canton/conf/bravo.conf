# BravoBank's node: provides cash, takes collateral, and publishes the
# collateral schedule it accepts.
canton.participants.bravo {
  storage {
    type = postgres
    config {
      dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
      properties {
        serverName = "postgres"
        portNumber = 5432
        databaseName = "canton_bravo"
        user = "canton"
        # Local PoC only; in production inject a secret.
        password = "canton"
      }
    }
    parameters.max-connections = 8
  }

  ledger-api      { address = "0.0.0.0", port = 5041 }
  http-ledger-api { address = "0.0.0.0", port = 7041 }
  admin-api       { address = "0.0.0.0", port = 5042 }
}
