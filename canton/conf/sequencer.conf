# Sequencer: orders and delivers encrypted messages; does not see transaction contents.
canton.sequencers.sequencer1 {
  storage {
    type = postgres
    config {
      dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
      properties {
        serverName = "postgres"
        portNumber = 5432
        databaseName = "canton_sequencer"
        user = "canton"
        # Local PoC only; in production inject a secret.
        password = "canton"
      }
    }
    parameters.max-connections = 8
  }

  # 0.0.0.0: the default 127.0.0.1 is unreachable from outside the container.
  public-api { address = "0.0.0.0", port = 5001 }
  admin-api  { address = "0.0.0.0", port = 5002 }
}
