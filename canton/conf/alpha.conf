# AlphaBank's node: delivers collateral and takes cash (the GMRA "seller",
# since a repo is legally a sale).
canton.participants.alpha {
  storage {
    type = postgres
    config {
      dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
      properties {
        serverName = "postgres"
        portNumber = 5432
        databaseName = "canton_alpha"
        user = "canton"
        # Local PoC only; in production inject a secret.
        password = "canton"
      }
    }
    parameters.max-connections = 8
  }

  ledger-api      { address = "0.0.0.0", port = 5031 }
  http-ledger-api { address = "0.0.0.0", port = 7031 }
  admin-api       { address = "0.0.0.0", port = 5032 }
}
