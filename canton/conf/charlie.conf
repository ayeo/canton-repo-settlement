# CharlieBank's node: a second lender, competing with BravoBank for the same offers.
canton.participants.charlie {
  storage {
    type = postgres
    config {
      dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
      properties {
        serverName = "postgres"
        portNumber = 5432
        databaseName = "canton_charlie"
        user = "canton"
        # Local PoC only; in production inject a secret.
        password = "canton"
      }
    }
    parameters.max-connections = 8
  }

  ledger-api      { address = "0.0.0.0", port = 5051 }
  http-ledger-api { address = "0.0.0.0", port = 7051 }
  admin-api       { address = "0.0.0.0", port = 5052 }
}
