# Mediator: collects confirmations and announces outcomes. It receives only
# hashes, never transaction contents.
canton.mediators.mediator1 {
  storage {
    type = postgres
    config {
      dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
      properties {
        serverName = "postgres"
        portNumber = 5432
        databaseName = "canton_mediator"
        user = "canton"
        # Local PoC only; in production inject a secret.
        password = "canton"
      }
    }
    parameters.max-connections = 8
  }

  admin-api { address = "0.0.0.0", port = 5003 }
}
