# The central bank's node: hosts CentralBank, signatory of every cash balance
# and hold. It never sees a security or a trade's terms.
canton.participants.centralbank {
  storage {
    type = postgres
    config {
      dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
      properties {
        serverName = "postgres"
        portNumber = 5432
        databaseName = "canton_centralbank"
        user = "canton"
        # Local PoC only; in production inject a secret.
        password = "canton"
      }
    }
    parameters.max-connections = 8
  }

  ledger-api      { address = "0.0.0.0", port = 5021 }
  http-ledger-api { address = "0.0.0.0", port = 7021 }
  admin-api       { address = "0.0.0.0", port = 5022 }
}
